<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="'JetBrains Mono',Consolas,Menlo,monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f43f5e"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="760" fill="#020617"/>
  <rect width="1240" height="760" fill="url(#grid)"/>
  <rect width="1240" height="72" fill="url(#hdr)"/>
  <text x="30" y="34" fill="#f1f5f9" font-size="20" font-weight="bold" letter-spacing="2">PERCH-AGENT : MCP WORKER PROTOCOL</text>
  <text x="30" y="56" fill="#64748b" font-size="11">orchestrator -&gt; mcp stdio -&gt; official cli -&gt; perch cloud | everything local except the model call</text>
  <circle cx="1196" cy="30" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="1160" y="52" fill="#475569" font-size="9">stdio://</text>

  <!-- forward arrows: channel y=225 -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="280" y1="225" x2="346" y2="225" marker-end="url(#arr)"/>
    <line x1="610" y1="225" x2="666" y2="225" marker-end="url(#arr)"/>
    <line x1="940" y1="225" x2="986" y2="225" marker-end="url(#arr)"/>
  </g>
  <g font-size="10" fill="#cbd5e1" text-anchor="middle">
    <text x="313" y="210">stdio</text>
    <text x="638" y="210">spawn</text>
    <text x="963" y="210">https</text>
  </g>

  <!-- return arrows: channel y=392 -->
  <g stroke="#38bdf8" stroke-width="1.4" fill="none">
    <line x1="986" y1="392" x2="940" y2="392" marker-end="url(#arrBlue)"/>
    <line x1="666" y1="392" x2="610" y2="392" marker-end="url(#arrBlue)"/>
    <line x1="346" y1="392" x2="280" y2="392" marker-end="url(#arrBlue)"/>
  </g>
  <g font-size="10" fill="#38bdf8" text-anchor="middle">
    <text x="963" y="412">evidence</text>
    <text x="640" y="412">events</text>
    <text x="322" y="412">progress</text>
  </g>

  <!-- panel 1: orchestrator -->
  <g>
    <rect x="30" y="150" width="260" height="280" rx="10" fill="#0c1a24" stroke="#22d3ee" stroke-opacity=".55"/>
    <rect x="30" y="150" width="260" height="34" rx="10" fill="#22d3ee" fill-opacity=".12"/>
    <text x="46" y="172" fill="#22d3ee" font-size="12" font-weight="bold">ORCHESTRATOR</text>
    <text x="46" y="212" fill="#e2e8f0" font-size="12">Claude Code / opencode</text>
    <text x="46" y="240" fill="#64748b" font-size="11">- keeps plan + deadlines</text>
    <text x="46" y="262" fill="#64748b" font-size="11">- calls delegate_to_perch</text>
    <text x="46" y="284" fill="#64748b" font-size="11">- polls perch_job_status</text>
    <text x="46" y="306" fill="#64748b" font-size="11">- judges evidence, iterates</text>
    <text x="46" y="352" fill="#475569" font-size="10">claude stays the orchestrator --</text>
    <text x="46" y="370" fill="#475569" font-size="10">perch is the worker, not the boss</text>
  </g>

  <!-- panel 2: server -->
  <g>
    <rect x="350" y="120" width="260" height="360" rx="10" fill="#04170f" stroke="#34d399" stroke-opacity=".55"/>
    <rect x="350" y="120" width="260" height="34" rx="10" fill="#34d399" fill-opacity=".12"/>
    <text x="366" y="142" fill="#34d399" font-size="12" font-weight="bold">PERCH-AGENT SERVER</text>
    <text x="366" y="180" fill="#e2e8f0" font-size="11" font-weight="bold">tools</text>
    <text x="366" y="202" fill="#94a3b8" font-size="11">delegate_to_perch</text>
    <text x="366" y="222" fill="#94a3b8" font-size="11">perch_job_status</text>
    <text x="366" y="242" fill="#94a3b8" font-size="11">perch_job_cancel</text>
    <text x="366" y="262" fill="#94a3b8" font-size="11">perch_status</text>
    <text x="366" y="296" fill="#e2e8f0" font-size="11" font-weight="bold">built-in discipline</text>
    <text x="366" y="318" fill="#94a3b8" font-size="11">karpathy guidelines</text>
    <text x="366" y="338" fill="#94a3b8" font-size="11">per-job timeout, kill tree</text>
    <text x="366" y="358" fill="#94a3b8" font-size="11">wait_seconds --&gt; job_id</text>
    <text x="366" y="378" fill="#94a3b8" font-size="11">progress notifications</text>
    <text x="366" y="398" fill="#94a3b8" font-size="11">robust run-JSON parser</text>
    <text x="366" y="446" fill="#475569" font-size="10">env: PERCH_AGENT_MODEL /</text>
    <text x="366" y="462" fill="#475569" font-size="10">EFFORT / DEFAULT_CWD / CLI</text>
  </g>

  <!-- panel 3: cli -->
  <g>
    <rect x="670" y="150" width="260" height="280" rx="10" fill="#171303" stroke="#fbbf24" stroke-opacity=".55"/>
    <rect x="670" y="150" width="260" height="34" rx="10" fill="#fbbf24" fill-opacity=".12"/>
    <text x="686" y="172" fill="#fbbf24" font-size="12" font-weight="bold">OFFICIAL PERCH CLI</text>
    <text x="686" y="212" fill="#e2e8f0" font-size="12">perch run "task" --json</text>
    <text x="686" y="240" fill="#64748b" font-size="11">--cwd | --mode agents|ask</text>
    <text x="686" y="262" fill="#64748b" font-size="11">--model pin | --effort high</text>
    <text x="686" y="284" fill="#64748b" font-size="11">--thread (continuation)</text>
    <text x="686" y="306" fill="#64748b" font-size="11">--permission take_the_wheel</text>
    <text x="686" y="352" fill="#475569" font-size="10">official surface only -- no</text>
    <text x="686" y="370" fill="#475569" font-size="10">internal APIs, no token proxy</text>
  </g>

  <!-- panel 4: cloud -->
  <g>
    <rect x="990" y="150" width="220" height="280" rx="10" fill="#120b24" stroke="#a78bfa" stroke-opacity=".55"/>
    <rect x="990" y="150" width="220" height="34" rx="10" fill="#a78bfa" fill-opacity=".12"/>
    <text x="1006" y="172" fill="#a78bfa" font-size="12" font-weight="bold">PERCH CLOUD</text>
    <text x="1006" y="212" fill="#e2e8f0" font-size="12">app.perchai.app</text>
    <text x="1006" y="240" fill="#64748b" font-size="11">Roost auto-routing</text>
    <text x="1006" y="262" fill="#64748b" font-size="11">turn-ticket + model-call</text>
    <text x="1006" y="298" fill="#c4b5fd" font-size="11">Qwen 3.8 Max (promo)</text>
    <text x="1006" y="320" fill="#c4b5fd" font-size="11">DeepSeek V4 / Kimi K2.5</text>
    <text x="1006" y="342" fill="#c4b5fd" font-size="11">GLM 5.3 Flash / more</text>
  </g>

  <!-- cancel path -->
  <path d="M480 480 L480 560 L160 560 L160 434" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="320" y="584" fill="#f43f5e" font-size="10" text-anchor="middle">perch_job_cancel / client abort --&gt; taskkill /T /F (whole tree, mid-run)</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="30" y="716" width="10" height="10" fill="#22d3ee"/><text x="46" y="725" fill="#94a3b8">orchestrator</text>
    <rect x="160" y="716" width="10" height="10" fill="#34d399"/><text x="176" y="725" fill="#94a3b8">mcp server</text>
    <rect x="282" y="716" width="10" height="10" fill="#fbbf24"/><text x="298" y="725" fill="#94a3b8">official cli</text>
    <rect x="402" y="716" width="10" height="10" fill="#a78bfa"/><text x="418" y="725" fill="#94a3b8">cloud + models</text>
    <rect x="540" y="716" width="10" height="10" fill="#38bdf8"/><text x="556" y="725" fill="#94a3b8">results / evidence back</text>
    <rect x="726" y="716" width="10" height="10" fill="#f43f5e"/><text x="742" y="725" fill="#94a3b8">cancellation path</text>
    <text x="1210" y="725" fill="#334155" text-anchor="end">perch-agent-mcp v1.0</text>
  </g>
</svg>
