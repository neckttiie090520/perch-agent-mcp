<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'JetBrains Mono',ui-monospace,monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f43f5e"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="640" fill="#020617"/>
  <rect width="1120" height="640" fill="url(#grid)"/>
  <rect width="1120" height="64" fill="url(#hdr)"/>

  <text x="24" y="30" fill="#f1f5f9" font-size="19" font-weight="bold" letter-spacing="2">PERCH-AGENT · MCP WORKER PROTOCOL</text>
  <text x="24" y="50" fill="#64748b" font-size="11">orchestrator → mcp stdio → official cli → perch cloud · everything local except the model call</text>
  <circle cx="1084" cy="28" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="1046" y="49" fill="#475569" font-size="9">stdio://</text>

  <!-- arrows (behind boxes) -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M262 250 H320" marker-end="url(#arr)"/>
    <path d="M578 250 H636" marker-end="url(#arr)"/>
    <path d="M842 250 H900" marker-end="url(#arr)"/>
    <path d="M900 330 H842" marker-end="url(#arr)" stroke="#38bdf8"/>
    <path d="M842 360 H636" marker-end="url(#arr)" stroke="#38bdf8"/>
    <path d="M636 392 H320" marker-end="url(#arr)" stroke="#38bdf8"/>
  </g>
  <path d="M578 470 C500 500 420 500 322 470" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>

  <g font-size="10" fill="#cbd5e1">
    <text x="264" y="240">mcp stdio</text>
    <text x="584" y="240">spawn child</text>
    <text x="850" y="240">https</text>
    <text x="850" y="322" fill="#38bdf8">structured JSON</text>
    <text x="700" y="352" fill="#38bdf8">SSE events + usage</text>
    <text x="420" y="384" fill="#38bdf8">progress notifications</text>
    <text x="380" y="505" fill="#f43f5e">cancel → taskkill /T /F  (job killed mid-run)</text>
  </g>

  <!-- panel: orchestrator -->
  <g>
    <rect x="20" y="150" width="242" height="200" rx="10" fill="#0c1a24" stroke="#22d3ee" stroke-opacity=".55"/>
    <rect x="20" y="150" width="242" height="34" rx="10" fill="#22d3ee" fill-opacity=".12"/>
    <text x="36" y="172" fill="#22d3ee" font-size="12" font-weight="bold">ORCHESTRATOR</text>
    <text x="36" y="208" fill="#e2e8f0" font-size="12">Claude Code / opencode</text>
    <text x="36" y="232" fill="#64748b" font-size="10">· keeps plan + deadlines</text>
    <text x="36" y="252" fill="#64748b" font-size="10">· calls delegate_to_perch</text>
    <text x="36" y="272" fill="#64748b" font-size="10">· polls perch_job_status</text>
    <text x="36" y="292" fill="#64748b" font-size="10">· judges evidence, iterates</text>
    <text x="36" y="326" fill="#475569" font-size="9">claude stays the orchestrator —</text>
    <text x="36" y="340" fill="#475569" font-size="9">perch is the worker, never the boss</text>
  </g>

  <!-- panel: perch-agent server -->
  <g>
    <rect x="320" y="130" width="258" height="290" rx="10" fill="#04170f" stroke="#34d399" stroke-opacity=".55"/>
    <rect x="320" y="130" width="258" height="34" rx="10" fill="#34d399" fill-opacity=".12"/>
    <text x="336" y="152" fill="#34d399" font-size="12" font-weight="bold">PERCH-AGENT · MCP SERVER</text>
    <text x="336" y="188" fill="#e2e8f0" font-size="11">tools</text>
    <text x="336" y="208" fill="#94a3b8" font-size="10">· delegate_to_perch</text>
    <text x="336" y="226" fill="#94a3b8" font-size="10">· perch_job_status</text>
    <text x="336" y="244" fill="#94a3b8" font-size="10">· perch_job_cancel</text>
    <text x="336" y="262" fill="#94a3b8" font-size="10">· perch_status</text>
    <text x="336" y="292" fill="#e2e8f0" font-size="11">built-in discipline</text>
    <text x="336" y="312" fill="#94a3b8" font-size="10">· karpathy guidelines preamble</text>
    <text x="336" y="330" fill="#94a3b8" font-size="10">· per-job timeout → kill tree</text>
    <text x="336" y="348" fill="#94a3b8" font-size="10">· wait_seconds → job_id handoff</text>
    <text x="336" y="366" fill="#94a3b8" font-size="10">· progress notifications</text>
    <text x="336" y="384" fill="#94a3b8" font-size="10">· robust run-JSON parser</text>
    <text x="336" y="410" fill="#475569" font-size="9">env: PERCH_AGENT_MODEL / EFFORT / CWD</text>
  </g>

  <!-- panel: perch cli -->
  <g>
    <rect x="636" y="150" width="206" height="200" rx="10" fill="#171303" stroke="#fbbf24" stroke-opacity=".55"/>
    <rect x="636" y="150" width="206" height="34" rx="10" fill="#fbbf24" fill-opacity=".12"/>
    <text x="652" y="172" fill="#fbbf24" font-size="12" font-weight="bold">OFFICIAL PERCH CLI</text>
    <text x="652" y="208" fill="#e2e8f0" font-size="12">perch run "task" --json</text>
    <text x="652" y="232" fill="#64748b" font-size="10">· --cwd · --mode agents|ask</text>
    <text x="652" y="252" fill="#64748b" font-size="10">· --model pin · --effort high</text>
    <text x="652" y="272" fill="#64748b" font-size="10">· --thread (continuation)</text>
    <text x="652" y="292" fill="#64748b" font-size="10">· --permission take_the_wheel</text>
    <text x="652" y="326" fill="#475569" font-size="9">official surface — no internal</text>
    <text x="652" y="340" fill="#475569" font-size="9">APIs, no session-token proxying</text>
  </g>

  <!-- panel: perch cloud -->
  <g>
    <rect x="900" y="150" width="200" height="200" rx="10" fill="#120b24" stroke="#a78bfa" stroke-opacity=".55"/>
    <rect x="900" y="150" width="200" height="34" rx="10" fill="#a78bfa" fill-opacity=".12"/>
    <text x="916" y="172" fill="#a78bfa" font-size="12" font-weight="bold">PERCH CLOUD</text>
    <text x="916" y="208" fill="#e2e8f0" font-size="12">app.perchai.app</text>
    <text x="916" y="232" fill="#64748b" font-size="10">· Roost auto-routing</text>
    <text x="916" y="252" fill="#64748b" font-size="10">· turn-ticket + model-call</text>
    <text x="916" y="284" fill="#c4b5fd" font-size="10">Qwen 3.8 Max (promo)</text>
    <text x="916" y="304" fill="#c4b5fd" font-size="10">DeepSeek V4 · Kimi K2.5</text>
    <text x="916" y="324" fill="#c4b5fd" font-size="10">GLM 5.3 Flash · …</text>
  </g>

  <!-- legend -->
  <g font-size="10">
    <rect x="20" y="580" width="10" height="10" fill="#22d3ee"/><text x="36" y="589" fill="#94a3b8">orchestrator</text>
    <rect x="150" y="580" width="10" height="10" fill="#34d399"/><text x="166" y="589" fill="#94a3b8">mcp server</text>
    <rect x="272" y="580" width="10" height="10" fill="#fbbf24"/><text x="288" y="589" fill="#94a3b8">official cli</text>
    <rect x="392" y="580" width="10" height="10" fill="#a78bfa"/><text x="408" y="589" fill="#94a3b8">cloud + models</text>
    <rect x="530" y="580" width="10" height="10" fill="#38bdf8"/><text x="546" y="589" fill="#94a3b8">results / evidence back</text>
    <rect x="716" y="580" width="10" height="10" fill="#f43f5e"/><text x="732" y="589" fill="#94a3b8">cancellation path</text>
    <text x="1100" y="589" fill="#334155" text-anchor="end">perch-agent-mcp v1.0</text>
  </g>
</svg>
